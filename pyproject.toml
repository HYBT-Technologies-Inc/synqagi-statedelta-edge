[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "synqagi-statedelta-edge"
version = "0.1.0"
description = "Offline expected-to-observed intelligence and fine-tuned model assurance for Arm64 edge systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "AISC TECHNOLOGIES LTD"},
  {name = "HYBT Technologies"}
]
keywords = ["arm64", "edge-ai", "jetson", "quality-assurance", "fine-tuning", "physical-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux"
]
dependencies = []

[project.scripts]
statedelta = "synqagi_statedelta.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
